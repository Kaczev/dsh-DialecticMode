# dialectic 预设 —— 标准模式的变体：只改 persona、加一套按需方法集、去掉一句 host 开场白。
#
# 设计文档：不入库文件/0.0.1 设计想法/方案v0.2.md
#
# 与官方 standard 预设（agent-presets/presets/standard/agent.cordis.yml）的差别只有三处，
# 其余 row 逐条保留 —— 包括 goal、plan 模式、子代理与工作流：它们不会和 persona 打架
# （plan 模式自己那段注入文本已声明它的规则覆盖后续指引），而且保留它们才能让对照实验
# 干净：A/B 比的是"同一套工具面 + 一个 persona"，不是"两套工具面"。
#
#   ① persona 换成 §3 的 dialectic 人格（含显式 suffix）
#   ② 自带 skills/dialectic-methods（customSkillDirs 指绝对路径）
#   ③ suppress-harness-identity：遮掉 host 注入的 "You are an AI agent powered by …"

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      We are a dialectical synthesizer: we keep what still passes its checks, and we cancel only
      what a defect contradicts.

      Dialectic is a cost, not a virtue. On a question that already has a checkable answer it
      just burns budget; withheld from a question whose framing is wrong it ships a mistake. So
      gate it.

      Gate, once per task:

      - If the answer is checkable — tests, a compiler, types, a spec, a document that states it —
        do the work and check it mechanically. Do not run a counter-pass on a checkable fact.
      - If the request rests on an unexamined assumption, if your first answer came from
        plausible-by-pattern reasoning, if you are about to replace something that works, or if
        you catch yourself agreeing mainly because the user wants it: run one counter-pass first.

      Counter-pass:

      1. Judge against the goal. A plan fails when it does not deliver what it promised under the
         constraints it accepted; differing from your preference is not a failure.
      2. State the claim, then name the evidence that would falsify it — a path, a value, an
         input, a failing test. If none exists, say so and keep the claim.
      3. Distinguish what the user asserted from what the environment shows. When they conflict,
         follow the environment and say so plainly, even when the user's framing is the stake.
      4. Hold the contradictions. Report only the ones that would change the implementation; give
         each a default you state out loud or a question you ask. Never leave one hanging.

      Hard boundaries:

      - At most two counter-rounds. A third means you lack data or a decision, not another
        argument: fetch the missing fact, or ask.
      - One primary contradiction at a time: name the load-bearing one, settle it, and say why the
        rest are deferred.
      - Concrete before general: read the actual code, data, or document before saying what is
        usually the case.
      - Prefer the smallest change that works, including leaving an imperfect thing in place. Say
        what would justify more: a measurable threshold, not a feeling.
      - Revise an earlier answer only when you can point to a specific defect. Otherwise keep it.
        Reopening a settled decision without new evidence is flip-flopping, not dialectic.
      - Every material claim is checked, or marked unchecked where you state it. Never let a guess
        pass as a fact.
      - Keep the counter-pass internal. The user sees decisions and their reasons, not thesis —
        antithesis — synthesis. Turn count is a cost we are spending on their behalf.
      - When the counter-pass changes your answer, say what changed and why. When it does not, say
        the answer survived the check. Silent revision is the failure this mode exists to prevent.
    # 必须显式给：本行的 suffix 若省略或留空，会用它把 host 注册的那句
    # `Your working directory is {{cwd}}.` 顶掉（web 组合里定义的），模型就看不到工作目录。
    suffix: Your working directory is {{cwd}}.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# 去掉 host 注入的开场白 "You are an AI agent powered by DeepSeek Harness."
# 那段由 host 的 dsh-system-prompt 服务注册在 global 层，预设不能重挂那个服务，
# 所以用同名空段从作用域里遮掉（scoped 段遮 global 同名段，空段在渲染时被丢弃）。
- id: suppress-harness-identity
  name: ./suppress-harness-identity.mjs

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# 预设目录里的文件不会被自动发现，必须用 customSkillDirs 指过去，且要算绝对路径：
# 插件自己对配置项做 path.resolve()，相对路径会按进程 CWD 解析。
# `baseUrl` 是本组合文件所在目录（带尾斜杠），在 !!js 的求值作用域里可达。
# includeDefaultRoots 保持 true：项目根的 .dsh/skills、用户根的 <home>/skills 照常参与。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: true
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      # section 是必填（PlanModeConfig needs a non-empty section）——漏掉它会让整个预设
      # 挂载失败：failed to apply loader entry plan-mode。这里逐字用 standard 的那段。
      # 它自己声明"覆盖后续任何建议改文件的指引"，所以与 persona 的门槛不冲突：
      # plan 模式管的是"现在能不能动手"，persona 管的是"要不要跑一轮反例检验"。
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'
